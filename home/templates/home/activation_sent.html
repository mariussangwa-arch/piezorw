{% extends 'home/base.html' %}
{% block title %}Check Your Email{% endblock %}
{% block content %}
<div class="text-center py-5">
    <i class="fas fa-envelope-open-text fa-4x mb-4 text-primary"></i>
    <h2>Email Sent!</h2>
    <p class="lead">We've sent a verification link to your email.</p>
    <p>Click the link to activate your account. Check spam if not in inbox.</p>
    <a href="{% url 'login' %}" class="btn btn-outline-light mt-3">Back to Login</a>
</div>
{% endblock %}
