{% extends 'home/base.html' %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-5 mt-5 shadow-lg" style="border-radius: 20px;">
            <h3 class="text-center mb-4">Forgot Password?</h3>
            <p class="text-center">Enter your email to receive a password reset link.</p>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">{{ form.email }}</div>
                <button type="submit" class="btn btn-primary w-100 btn-lg">Send Reset Link</button>
            </form>
            <div class="text-center mt-4">
                <a href="{% url 'login' %}">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
