{% extends 'home/base.html' %}
{% block title %}PDF Viewer{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="text-center mb-4">
        <h3><i class="fas fa-file-pdf text-danger"></i> PDF Viewer</h3>
        <a href="{% url 'all_files' %}" class="btn btn-outline-secondary">Back</a>
    </div>

    <iframe 
        src="{{ pdf_url }}#toolbar=1&navpanes=1&scrollbar=1"
        width="100%" 
        height="1000px"
        style="border:none; border-radius:12px; box-shadow:0 0 30px rgba(0,0,0,0.3);"
        allowfullscreen>
    </iframe>
</div>
{% endblock %}
