{% extends 'home/base.html' %}

{% block title %}Upload File{% endblock %}

{% block content %}
    <h2>Upload File</h2>
    <form method="post" enctype="multipart/form-data" class="card p-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Upload</button>
    </form>
{% endblock %}
